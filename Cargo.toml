[package]
name = "apk_downloader"
version = "0.1.0"
edition = "2024"
description = "Google Play アプリの取得操作を簡略化する Windows 常駐ツール"

# 配布物のファイル名。スネークケースの crate 名をそのまま出したくない。
[[bin]]
name = "APKDownloader"
path = "src/main.rs"

[dependencies]
eframe = "0.35.0"
egui = "0.35.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0.104"

# HTTP は blocking で通す。GUI 側に async ランタイムを持ち込まないため、
# 通信はすべてワーカースレッドから同期呼び出しする。
reqwest = { version = "0.13.4", features = ["blocking", "gzip", "brotli"] }
# 拡張機能からの受け口。localhost 限定の極小サーバーで足りる。
tiny_http = "0.12.0"
tray-icon = "0.24.2"
arboard = "3.6.1"
global-hotkey = "0.8.0"
# Play のアイコンは webp が多い。png/jpeg も来るので 3 つ有効にする。
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = "0.17.2"
open = "5.4.0"
urlencoding = "2.1.3"
# 完了通知。Windows ではトースト通知になる。
notify-rust = "4.18.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Dwm",
] }

# 配布は EXE 1 つきり。サイズと実行速度を優先する。
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
